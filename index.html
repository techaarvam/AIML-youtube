<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIML YouTube HTML Viewer</title>
  <link rel="icon" type="image/png" href="assets/techaarvam-logo.png">
  <link rel="apple-touch-icon" href="assets/techaarvam-logo.png">
  <style>
    :root {
      --bg: #f3efe6;
      --panel: #fffaf0;
      --ink: #1e1d1a;
      --muted: #6d6659;
      --line: #d7cfbf;
      --accent: #b44f2f;
      --accent-soft: #f3d7cc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, #fffdf6 0, #fffdf6 22%, transparent 22%),
        linear-gradient(135deg, #efe6d4 0%, #f8f4eb 45%, #ece4d6 100%);
      min-height: 100vh;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      padding: 24px;
      border-right: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.92);
      backdrop-filter: blur(8px);
      display: grid;
      align-content: start;
      gap: 18px;
    }

    .title {
      margin: 0;
      font-size: 1.4rem;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .brand {
      display: grid;
      gap: 12px;
      align-items: start;
    }

    .brand-link {
      display: inline-block;
      width: fit-content;
    }

    .brand-logo {
      display: block;
      width: min(240px, 100%);
      height: auto;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .page-link {
      display: block;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    .page-link:hover,
    .page-link:focus-visible {
      transform: translateY(-1px);
      border-color: var(--accent);
      outline: none;
    }

    .page-link.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .page-label {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .page-path {
      display: block;
      color: var(--muted);
      font-size: 0.9rem;
      word-break: break-all;
    }

    .content {
      padding: 24px;
    }

    .viewer-shell {
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 20px 60px rgba(80, 58, 26, 0.10);
    }

    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.9);
    }

    .viewer-title {
      margin: 0;
      font-size: 1rem;
    }

    .viewer-meta {
      color: var(--muted);
      font-size: 0.9rem;
      word-break: break-all;
    }

    iframe {
      width: 100%;
      border: 0;
      background: white;
      display: block;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 280px;
      padding: 32px;
      text-align: center;
      color: var(--muted);
    }

    .empty[hidden],
    iframe[hidden] {
      display: none;
    }

    code {
      background: rgba(0, 0, 0, 0.05);
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
    }

    .viewer-frame {
      min-height: 720px;
      height: 720px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .viewer-frame {
        min-height: 72vh;
      }

    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <a class="brand-link" href="https://techaarvam.com" target="_blank" rel="noopener noreferrer">
          <img class="brand-logo" src="assets/techaarvam-logo.png" alt="Tech Aarvam">
        </a>
        <div>
          <h1 class="title">Support files for the Tech Aarvam YouTube channel</h1>
        </div>
      </div>
      <div id="page-list" class="list"></div>
    </aside>

    <main class="content">
      <section class="viewer-shell">
        <div class="viewer-header">
          <h2 id="viewer-title" class="viewer-title">No page selected</h2>
          <div>
            <a id="viewer-open" class="page-path" href="#" target="_blank" rel="noopener noreferrer" hidden>Open Full Page</a>
            <div id="viewer-meta" class="viewer-meta"></div>
          </div>
        </div>
        <div id="empty-state" class="empty"></div>
        <iframe id="viewer" class="viewer-frame" title="HTML preview" hidden></iframe>
      </section>
    </main>
  </div>

  <script>
    const pageList = document.getElementById("page-list");
    const viewer = document.getElementById("viewer");
    const emptyState = document.getElementById("empty-state");
    const viewerTitle = document.getElementById("viewer-title");
    const viewerMeta = document.getElementById("viewer-meta");
    const viewerOpen = document.getElementById("viewer-open");
    const search = new URLSearchParams(window.location.search);
    const requestedPage = search.get("page");
    let resizeTimer = null;
    let currentSelectionType = "html";

    function normalizePages(data) {
      if (!Array.isArray(data.pages)) {
        return [];
      }

      return data.pages
        .filter((item) => item && typeof item.title === "string")
        .map((item) => {
          if (item.type === "embed") {
            return {
              type: "embed",
              title: item.title,
              path: item.path || item.src || item.url || item.title,
              src: item.src,
              url: item.url || item.src
            };
          }

          return {
            type: "html",
            title: item.title || item.path.replace(/\.html$/i, ""),
            path: item.path,
            src: item.path,
            url: item.path
          };
        })
        .filter((item) => {
          if (item.type === "embed") {
            return typeof item.src === "string" && item.src.length > 0;
          }

          return typeof item.path === "string" && item.path.endsWith(".html");
        });
    }

    function selectPage(path, pages) {
      const selected = pages.find((page) => page.path === path) || pages[0];

      if (!selected) {
        viewer.hidden = true;
        emptyState.hidden = false;
        viewerTitle.textContent = "No page selected";
        viewerMeta.textContent = "";
        viewerOpen.hidden = true;
        return;
      }

      const nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set("page", selected.path);
      history.replaceState({}, "", nextUrl);

      currentSelectionType = selected.type;
      viewer.src = selected.src;
      viewer.hidden = false;
      emptyState.hidden = true;
      viewerTitle.textContent = selected.title;
      viewerMeta.textContent = selected.path;
      viewerOpen.href = selected.url;
      viewerOpen.hidden = false;

      document.querySelectorAll(".page-link").forEach((link) => {
        link.classList.toggle("active", link.dataset.path === selected.path);
      });

      if (selected.type === "embed") {
        viewer.style.height = "420px";
      }
    }

    function resizeViewer() {
      if (viewer.hidden || !viewer.contentWindow) {
        return;
      }

      if (currentSelectionType === "embed") {
        viewer.style.height = "420px";
        return;
      }

      try {
        const doc = viewer.contentWindow.document;
        const bodyHeight = doc.body ? doc.body.scrollHeight : 0;
        const htmlHeight = doc.documentElement ? doc.documentElement.scrollHeight : 0;
        const nextHeight = Math.max(bodyHeight, htmlHeight, 720);
        viewer.style.height = `${nextHeight}px`;
      } catch (error) {
        viewer.style.height = "420px";
      }
    }

    function scheduleResize() {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(resizeViewer, 60);
    }

    function renderList(pages) {
      pageList.innerHTML = "";

      if (!pages.length) {
        const message = document.createElement("p");
        message.className = "subtitle";
        message.textContent = "No pages listed yet.";
        pageList.appendChild(message);
        return;
      }

      pages.forEach((page) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "page-link";
        button.dataset.path = page.path;
        button.innerHTML = `
          <span class="page-label">${page.title}</span>
          <span class="page-path">${page.path}</span>
        `;
        button.addEventListener("click", () => selectPage(page.path, pages));
        pageList.appendChild(button);
      });
    }

    viewer.addEventListener("load", () => {
      scheduleResize();

      try {
        const frameWindow = viewer.contentWindow;
        frameWindow.addEventListener("resize", scheduleResize);
        const doc = frameWindow.document;

        if (doc.fonts && doc.fonts.ready) {
          doc.fonts.ready.then(scheduleResize).catch(() => {});
        }
      } catch (error) {
        viewer.style.height = "720px";
      }
    });

    window.addEventListener("resize", scheduleResize);

    async function init() {
      try {
        const response = await fetch("./pages.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Unable to load pages.json (${response.status})`);
        }

        const data = await response.json();
        const pages = normalizePages(data);
        renderList(pages);
        if (pages.length) {
          selectPage(requestedPage, pages);
        } else {
          viewerMeta.textContent = "0 pages available";
        }
      } catch (error) {
        pageList.innerHTML = `<p class="subtitle">${error.message}</p>`;
        viewerTitle.textContent = "Configuration error";
        viewerMeta.textContent = "Check pages.json";
      }
    }

    init();
  </script>
</body>
</html>
